<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#ff6fa5,#ff9cc2,#ffd6e8);

overflow:hidden;

}

.container{

width:90%;

max-width:700px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(12px);

padding:50px;

border-radius:25px;

text-align:center;

box-shadow:0 20px 50px rgba(0,0,0,.2);

animation:fadeIn 1.5s;

z-index:2;

}

h1{

font-family:"Great Vibes",cursive;

font-size:70px;

color:white;

margin-bottom:20px;

}

h2{

color:white;

margin-bottom:25px;

}

p{

color:white;

font-size:18px;

line-height:1.8;

margin-bottom:35px;

}

button{

padding:16px 45px;

border:none;

border-radius:50px;

background:white;

color:#ff4f81;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

.heart{

position:absolute;

font-size:30px;

animation:float 8s linear infinite;

opacity:.7;

}

@keyframes float{

0%{

transform:translateY(100vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh);

opacity:0;

}

}

@keyframes fadeIn{

from{

opacity:0;

transform:scale(.8);

}

to{

opacity:1;

transform:scale(1);

}

}

</style>

</head>

<body>

<div id="hearts"></div>

<div class="container">

<h1>She Said Yes ❤️</h1>

<h2>Welcome To Our Little World</h2>

<p>

Thank you for saying yes.

Today marks the beginning of a beautiful journey that I hope we'll cherish together.

This little place was created with love, just for us.

I can't wait to make more memories with you.

</p>

<button onclick="beginJourney()">

Begin Our Journey ❤️

</button>

</div>

<script>

const hearts=document.getElementById("hearts");

for(let i=0;i<35;i++){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(5+Math.random()*6)+"s";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDelay=Math.random()*5+"s";

hearts.appendChild(heart);

}

function beginJourney(){

window.location.href="signup.html";

}

</script>

</body>
</html>
