<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#ffdde7,#ffeef4,#ffffff);

    overflow:hidden;

}

.hearts{

position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;

}

.heart{

position:absolute;
color:#ff4f81;
animation:float 8s linear infinite;
opacity:.3;

}

@keyframes float{

0%{

transform:translateY(100vh);
opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh);
opacity:0;

}

}

.container{

width:95%;
max-width:430px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 20px 60px rgba(0,0,0,.15);

text-align:center;

z-index:2;

}

h1{

font-family:'Great Vibes',cursive;
font-size:45px;
color:#ff4f81;

}

.subtitle{

margin:10px 0 30px;
color:#666;
line-height:1.6;

}

.input-box{

margin-bottom:18px;

}

.input-box input{

width:100%;
padding:16px;

border:2px solid #eee;

border-radius:15px;

font-size:16px;

outline:none;

transition:.3s;

}

.input-box input:focus{

border-color:#ff4f81;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:#ff4f81;

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#ff2969;

transform:translateY(-3px);

}

.login{

margin-top:25px;

font-size:15px;

}

.login a{

color:#ff2969;

text-decoration:none;

font-weight:600;

}

.footer{

margin-top:20px;

font-size:13px;

color:#999;

}

    </style>

</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="container">

<h1>Create Account ❤️</h1>

<p class="subtitle">
Welcome to our little world.<br>
Create your account to continue.
</p>

<form id="signupForm">

<div class="input-box">
<input
type="text"
id="name"
placeholder="Full Name"
required>
</div>

<div class="input-box">
<input
type="email"
id="email"
placeholder="Email Address"
required>
</div>

<div class="input-box">
<input
type="password"
id="password"
placeholder="Create Password"
required>
</div>

<div class="input-box">
<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>
</div>

<div class="input-box">
<input
type="text"
id="secretCode"
placeholder="Secret Code ❤️"
required>
</div>

<button id="signupBtn" type="submit">

Create My Account ❤️

</button>

</form>

<div class="login">

Already have an account?

<a href="login.html">

Login

</a>

</div>

<div class="footer">

Made with ❤️ by Benedict

</div>

</div>

<script>

const hearts=document.getElementById("hearts");

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*20)+"px";

heart.style.animationDuration=
(6+Math.random()*5)+"s";

hearts.appendChild(heart);

setTimeout(()=>{

heart.remove();

},10000);

},500);

</script>

<script type="module" src="signup.js"></script>

</body>
</html>
