<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benedict & Chiyere ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      overflow: hidden;
      background: #12060b;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          rgba(20, 3, 10, 0.62),
          rgba(20, 3, 10, 0.82)
        ),
        url("assets/images/couple.jpg") center/cover no-repeat;
      z-index: -2;
      transform: scale(1.03);
    }

    .blur {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: -1;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 42px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn 1s ease;
    }

    .heart {
      font-size: 48px;
      margin-bottom: 15px;
      animation: heartbeat 1.8s infinite;
    }

    .greeting {
      font-size: 17px;
      opacity: 0.88;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      margin: 0 0 7px 5px;
      opacity: 0.85;
    }

    .input-group input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 15px;
      transition: 0.25s ease;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .input-group input:focus {
      border-color: rgba(255, 180, 205, 0.8);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 0 3px rgba(255, 130, 170, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: 16px;
      background: #e91e63;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 10px 25px rgba(233, 30, 99, 0.3);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      background: #f52b70;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .error {
      min-height: 20px;
      margin-top: 15px;
      color: #ffb4c8;
      font-size: 13px;
    }

    .music-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.13);
      color: #fff;
      cursor: pointer;
      font-size: 19px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.55;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 18px;
      opacity: 0;
      animation: floatHeart 7s linear infinite;
      pointer-events: none;
    }

    .h1 { left: 10%; animation-delay: 0s; }
    .h2 { left: 30%; animation-delay: 2s; }
    .h3 { left: 55%; animation-delay: 4s; }
    .h4 { left: 80%; animation-delay: 1s; }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.13);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }

      15% {
        opacity: 0.65;
      }

      80% {
        opacity: 0.35;
      }

      100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 36px 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="blur"></div>

  <!-- Floating hearts -->
  <div class="floating-heart h1">❤️</div>
  <div class="floating-heart h2">💕</div>
  <div class="floating-heart h3">❤️</div>
  <div class="floating-heart h4">💗</div>

  <main class="container">

    <section class="login-card">

      <div class="heart">❤️</div>

      <div class="greeting">Good evening</div>

      <h1>
        Welcome back,<br>
        Benedict & Chiyere
      </h1>

      <p class="subtitle">
        Our little private space
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">Your email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="input-group">
          <label for="secretCode">Secret code</label>
          <input
            type="password"
            id="secretCode"
            placeholder="Enter our secret code"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Enter Our Space ❤️
        </button>

        <div class="error" id="errorMessage"></div>

      </form>

      <div class="footer">
        Just you & me ❤️
      </div>

    </section>

  </main>

  <!-- Music -->
  <audio id="backgroundMusic" loop>
    <source src="assets/music/our-song.mp3" type="audio/mpeg">
  </audio>

  <button
    class="music-button"
    id="musicButton"
    type="button"
    aria-label="Play music"
  >
    🎵
  </button>

  <script type="module">

    import { auth } from "./js/firebase.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const secretCodeInput = document.getElementById("secretCode");
    const loginBtn = document.getElementById("loginBtn");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = emailInput.value.trim();
      const secretCode = secretCodeInput.value;

      errorMessage.textContent = "";

      if (!email || !secretCode) {
        errorMessage.textContent =
          "Please enter your email and secret code.";
        return;
      }

      loginBtn.classList.add("loading");
      loginBtn.textContent = "Entering our space... ❤️";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          secretCode
        );

        window.location.href = "home.html";

      } catch (error) {

        console.error(error);

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          errorMessage.textContent =
            "The email or secret code isn't correct.";
        } else if (error.code === "auth/too-many-requests") {
          errorMessage.textContent =
            "Too many attempts. Please try again later.";
        } else {
          errorMessage.textContent =
            "Something went wrong. Please try again.";
        }

        loginBtn.classList.remove("loading");
        loginBtn.textContent = "Enter Our Space ❤️";
      }

    });


    /* Music */

    const music = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");

    let playing = false;

    musicButton.addEventListener("click", async () => {

      try {

        if (!playing) {
          await music.play();
          playing = true;
          musicButton.textContent = "🔊";
        } else {
          music.pause();
          playing = false;
          musicButton.textContent = "🎵";
        }

      } catch (error) {
        console.log("Music could not start:", error);
      }

    });

  </script>

</body>
</html>
